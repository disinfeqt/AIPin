<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AIPin world map pin. Render: resvg -w 128 -h 128 pin.svg pin.png
       The point of the pin is at (32, 58): AIPin.lua's PIN_TIP = 58/64. -->
  <defs>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#ffd24a"/>
      <stop offset="0.75" stop-color="#e09a1c"/>
      <stop offset="1" stop-color="#9c5e0c"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2b4a73"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <!-- contact shadow under the point -->
  <ellipse cx="32" cy="58.5" rx="6.5" ry="2.2" fill="#000" opacity="0.45" filter="url(#blur)"/>
  <g filter="url(#drop)">
    <path id="body" d="M32 58 C29 50 16.5 41 15.2 31.5 A17.5 17.5 0 1 1 48.8 31.5 C47.5 41 35 50 32 58 Z"
          fill="url(#gold)" stroke="#2a1704" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <!-- inner rim light -->
  <path d="M32 54.2 C29.6 48 18.6 40 17.6 31.2 A15 15 0 1 1 46.4 31.2 C45.4 40 34.4 48 32 54.2 Z"
        fill="none" stroke="#fff6cc" stroke-opacity="0.45" stroke-width="1.1"/>
  <!-- hole -->
  <circle cx="32" cy="26.2" r="7.6" fill="url(#hole)" stroke="#6e4306" stroke-width="1.6"/>
  <!-- gloss -->
  <ellipse cx="24.5" cy="15.5" rx="5" ry="2.6" transform="rotate(-35 24.5 15.5)" fill="#fff" opacity="0.55"/>
</svg>
